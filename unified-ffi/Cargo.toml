[package]
name = "unified_ffi"
version = "0.1.0"
edition = "2024"
# MIT applies to project-owned/authorized contributions only (scope: ../LICENSE).
# Inherited third-party material keeps its original license and notice (e.g. the
# idevice heartbeat client behaviour, MIT, ../licenses/cargo/idevice-0.1.68/).
license = "MIT"
publish = false
description = "C ABI for the unified on-device agent spike: lockdown probe and a state-preserving WDA observation"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Same pin as ../../real/runner-ffi (jkcoxson/idevice v0.1.68, MIT). Kept in
# lockstep so the heartbeat module can be included from there unchanged.
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "3854a5df4a5a6dee71ffce4d8befc2ea356a8065", features = [
  "xctest",
  "wda",
  "tcp",
  "heartbeat",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
serde_json = "1"

[dev-dependencies]
plist = "1.8"
tokio = { version = "1", features = ["io-util", "sync", "net"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
